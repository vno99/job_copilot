# CI : vérifie à chaque commit que le nouveau code ne casse rien.
#
#   - Sur chaque push (n'importe quelle branche) : tests unitaires (Back) +
#     tests et build (Front) — run léger et rapide.
#   - Sur chaque pull request : en plus, les tests d'intégration (conteneur
#     PostgreSQL jetable démarré par le fixture `docker_postgres` — Docker est
#     disponible sur les runners `ubuntu-latest`).
#
# Le LLM est mocké par le fixture `_mock_llm` du `conftest.py` : aucune
# clé OPENROUTER_API_KEY n'est requise, la suite est déterministe et hors-ligne.
#
# Note : `pytest` et `httpx` (TestClient de FastAPI) ne sont dans aucun
# requirements.txt → installés explicitement. `playwright` (package) suffit :
# le navigateur Chromium n'est pas installé, le fetch d'URL est mocké dans les
# tests.

name: CI

on:
  push:
  pull_request:

# Un seul run en cours par branche : un nouveau commit annule le précédent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Run léger sur chaque commit : unitaires seulement (pas d'intégration).
  back-unit:
    name: Back — tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            api/requirements.txt

      - name: Installer les dépendances
        run: |
          pip install pytest httpx
          pip install -r requirements.txt
          pip install -r api/requirements.txt

      - name: Tests unitaires
        run: python -m pytest tests/ -q -m "not integration"

  # Intégration réservée aux PR : démarre un conteneur PostgreSQL jetable.
  back-integration:
    name: Back — tests d'intégration (Docker)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            api/requirements.txt

      - name: Installer les dépendances
        run: |
          pip install pytest httpx
          pip install -r requirements.txt
          pip install -r api/requirements.txt

      - name: Tests d'intégration (Docker)
        run: python -m pytest tests/ -q -m integration

  front:
    name: Front (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Tests (vitest)
        run: npm test

      - name: Build (next build)
        run: npm run build
