# CI : vérifie à chaque commit que le nouveau code ne casse rien.
#
#   - Sur chaque push : tests unitaires (Back) + tests et build (Front),
#     build Docker, lint, sécurité, cohérence docs, build DAG, standalone.
#   - Sur chaque pull request : en plus, tests d'intégration (conteneur PostgreSQL
#     jetable démarré par le fixture `docker_postgres` — Docker disponible).
#
# Le LLM est mocké par le fixture `_mock_llm` du `conftest.py` : aucune clé
# OPENROUTER_API_KEY n'est requise, la suite est déterministe et hors-ligne.
#
# Note : `pytest` et `httpx` ne sont dans aucun requirements.txt → installés
# explicitement. `playwright` (package) suffit : le navigateur n'est pas
# installé, le fetch d'URL est mocké dans les tests.

name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Sécurité & cohérence docs ---
  security-docs:
    name: Sécurité & cohérence docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que .env n'est pas commis
        run: |
          if git ls-files | grep -q '^\.env$'; then
            echo "ERREUR : .env est versionné !"
            exit 1
          fi

      - name: Vérifier absence MISTRAL_API_KEY dans le dépôt
        run: |
          if git grep -q "MISTRAL_API_KEY" . -- ':!node_modules' ':!.next'; then
            echo "ERREUR : MISTRAL_API_KEY trouvé dans un fichier versionné"
            exit 1
          fi

      - name: Vérifier cohérence docs (OpenRouter)
        run: |
          for f in docs/api-contract.md README.md .env.example; do
            if grep -q "MISTRAL_API_KEY" "$f" 2>/dev/null; then
              echo "ERREUR : $f mentionne encore MISTRAL_API_KEY"
              exit 1
            fi
          done

  # --- Vérifications supplémentaires ---
  check-api:
    name: Vérifier chargement FastAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérifier import app
        run: |
          pip install -q -r requirements.txt -r api/requirements.txt || true
          python -c "from api.app.main import app; print('FastAPI OK')"

  check-sql:
    name: Vérifier schéma SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier sql/tables.sql
        run: |
          if [ ! -s sql/tables.sql ]; then
            echo "ERREUR : sql/tables.sql vide ou manquant"
            exit 1
          fi
          echo "Schéma SQL OK"

  # --- Build Docker ---
  build-docker:
    name: Build Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Créer .env temporaire pour Docker
        run: |
          cat << EOF > .env
          AIRFLOW_UID=197608
          AIRFLOW_POSTGRES_USER=airflow
          AIRFLOW_POSTGRES_PASSWORD=airflow
          AIRFLOW_POSTGRES_DB=airflow
          _AIRFLOW_WWW_USER_USERNAME=airflow
          _AIRFLOW_WWW_USER_PASSWORD=airflow
          JOB_COPILOT_POSTGRES_USER=user
          JOB_COPILOT_POSTGRES_PASSWORD=password
          JOB_COPILOT_POSTGRES_DB=job_copilot
          DATABASE_URL=postgresql+psycopg2://user:password@localhost:5434/job_copilot
          DOCKER_DATABASE_URL=postgresql+psycopg2://user:password@postgres-data:5432/job_copilot
          PYTHONPATH=/opt/airflow
          OPENROUTER_API_KEY=
          OPENROUTER_API_BASE=
          OPENROUTER_LLM_MODEL_SMALL=
          OPENROUTER_LLM_MODEL_LARGE=
          AIRFLOW__CORE__FERNET_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')
          AIRFLOW__API__SECRET_KEY=$(python -c 'import base64,os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')
          AIRFLOW__API_AUTH__JWT_SECRET=$(python -c 'import base64,os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')
          AIRFLOW__API_AUTH__JWT_ISSUER=airflow
          AIRFLOW__CORE__AUTH_MANAGER=airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
          AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
          AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://airflow:airflow@postgres/airflow
          AIRFLOW__CORE__EXECUTION_API_SERVER_URL=http://airflow-apiserver:8080/execution/
          EOF
          echo ".env temporaire créé"

      - name: Vérifier docker-compose
        run: docker compose config

      - name: Build image API + web
        run: docker compose build

  # --- Build DAG Airflow ---
  build-dag:
    name: Build DAG Airflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Installer Airflow + dépendances
        run: |
          pip install "apache-airflow>=3.0,<4.0"
          pip install -r requirements.txt -r api/requirements.txt
      - name: Vérifier compilation DAGs (search + job_copilot)
        run: |
          python -c "from dags.search_parameters_agent import *; print('search_parameters_agent OK')"
          python -c "from dags.job_copilot import *; print('job_copilot OK')"

  # --- Lint ---
  lint-back:
    name: Lint Python (back)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérifier syntaxe Python (tous modules)
        run: |
          pip install -q requirements.txt api/requirements.txt || true
          find src api dags -name '*.py' | while read f; do python -m py_compile "$f" || exit 1; done
          echo "Syntaxe Python OK"

  lint-front:
    name: Lint Front (ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Linter
        run: npm ci && npm run lint

  # --- Tests légers (push) ---
  back-unit:
    name: Back — tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            api/requirements.txt
      - name: Installer dépendances
        run: |
          pip install pytest httpx
          pip install -r requirements.txt
          pip install -r api/requirements.txt
      - name: Tests unitaires + couverture
        run: |
          pip install pytest pytest-cov
          python -m pytest tests/ -q -m "not integration" --cov=src --cov-report=term-missing --cov-fail-under=80

  back-integration:
    name: Back — tests d'intégration (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            api/requirements.txt
      - name: Installer dépendances
        run: |
          pip install pytest pytest-cov httpx
          pip install -r requirements.txt
          pip install -r api/requirements.txt
      - name: Tests d'intégration (Docker)
        run: python -m pytest tests/ -q -m integration --cov=src --cov-report=term-missing --cov-fail-under=80

  front:
    name: Front (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Installer dépendances
        run: npm ci
      - name: Tests (vitest)
        run: npm test
      - name: Build standalone (next build)
        run: npm run build
      - name: Vérifier standalone
        run: |
          if [ ! -f ".next/standalone/package.json" ]; then
            echo "ERREUR : sortie standalone non générée"
            exit 1
          fi
          echo "Standalone OK"
